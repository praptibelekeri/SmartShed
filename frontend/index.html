<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartSched-VM Dashboard</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>

<body>
<div class="container">

  <h1><i class="fa-solid fa-microchip"></i> SmartSched-VM Dashboard</h1>
  <p class="subtitle">Memory-Aware Adaptive CPU Scheduler</p>

  <!-- ADD PROCESS -->
  <div class="card">
    <h2>Add Process</h2>
    <form id="form" class="form-grid">
      <input id="pid" placeholder="PID (P1)" required>
      <input id="burst" type="number" placeholder="Burst Time" required>
      <input id="priority" type="number" placeholder="Priority" required>
      <input id="frames" type="number" placeholder="Frames" required>
      <input id="refs" placeholder="Refs (1 2 3)" required>
      <button type="submit">Add Process</button>
    </form>
  </div>

  <!-- RUN -->
  <div class="controls">
    <button onclick="run()">Run Scheduler</button>
  </div>

  <p id="status" class="status-text">Waiting for input…</p>

  <!-- TABLE -->
  <div class="card">
    <h2>Scheduler Decision Table</h2>
    <table id="table">
      <thead>
        <tr>
          <th>PID</th><th>Burst</th><th>Waiting</th>
          <th>Turnaround</th><th>Faults</th><th>Scheduler</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- CPU EXECUTION -->
  <div class="card">
    <h2>CPU Execution (Live)</h2>
    <canvas id="cpuCanvas" width="220" height="220"></canvas>
    <p id="currentProcess" class="status-text">CPU Idle</p>
  </div>

  <!-- GANTT -->
  <div class="card">
    <h2>CPU Execution Timeline (Gantt)</h2>
    <div id="ganttContainer"></div>
  </div>

  <!-- CPU UTIL -->
  <div class="card">
    <h2>CPU Utilisation</h2>
    <canvas id="cpuUtilCanvas" width="200" height="200"></canvas>
    <p id="cpuUtilText" class="status-text">CPU Utilisation: 0%</p>
  </div>

  <!-- VM -->
  <div class="card">
    <h2>Virtual Memory Frames (LRU)</h2>
    <div id="vmFrames" class="vm-frames"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
